name: Build

# Started by hand only (Actions -> Build -> Run workflow), so no build runs without being asked.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
          rm -f build/libs/*-sources.jar
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: iris-glint-fix
          path: build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'build/libs/*.jar'
