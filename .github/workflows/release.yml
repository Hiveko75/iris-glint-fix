# Builds the mod when started by hand (Actions -> Build and release -> Run workflow).
# When mod_version in gradle.properties has no release yet, it is also published as a release,
# with the version's section of CHANGELOG.md as the notes
# (with "replace" ticked, an existing release of that version is rebuilt).
name: Build and release

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the release if this version already has one
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
          rm -f build/libs/*-sources.jar
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: iris-glint-fix
          path: build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'build/libs/*.jar'

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d ' \r')
          MC=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d ' \r')
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" != "true" ]; then echo "release $TAG exists"; exit 0; fi
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          awk -v v="$TAG" '/^## /{f = (index($0, "## " v " ") == 1); next} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          gh release create "$TAG" build/libs/*.jar --target "$GITHUB_SHA" --title "Iris Glint Fix $TAG for Minecraft $MC" --notes-file notes.md
